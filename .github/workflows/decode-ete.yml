name: decode-ete

# Decode a Xiaomi 14 Pro (shennong, SM8650) CoreSight ETE v1.1 capture with a
# real Linux perf linked against a modern OpenCSD.
#
# Why a Linux runner: tools/perf is Linux-only, and the whole point is to
# reproduce perf's own decode path (tools/perf/util/cs-etm.c +
# cs-etm-decoder.c) with the OpenCSD version under our control.
#
# The capture is uploaded as a release asset so the runner can pull it with curl.
# Two variants are published:
#    meta.data        -- as captured (AUXTRACE_INFO says TRCTRACEIDR 0x10..0x1e)
#    meta-fixed.data  -- same bytes, per-CPU trace IDs rewritten to the ATB IDs
#                        the sink actually frames with (1..8), see
#                        tools/perfdata_fix_traceid.py
# Decoding both is what localises the failure.

on:
  workflow_dispatch:
    inputs:
      asset:
        description: 'release asset file name to decode'
        required: false
        default: 'meta-fixed.data'
      itrace:
        description: 'perf inject --itrace spec'
        required: false
        default: 'i100000il'

jobs:
  decode:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Show environment
        run: |
          uname -a
          nproc
          df -h / | head -3

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential flex bison pkg-config \
            libelf-dev libdw-dev libunwind-dev libcap-dev libnuma-dev \
            libssl-dev zlib1g-dev liblzma-dev libzstd-dev \
            libtraceevent-dev libslang2-dev libperl-dev python3-dev \
            systemtap-sdt-dev libbabeltrace-dev

      - name: Build and install OpenCSD v1.8.3
        run: |
          git clone --depth=1 -b v1.8.3 https://github.com/Linaro/OpenCSD.git opencsd
          make -C opencsd/decoder/build/linux -j"$(nproc)"
          sudo make -C opencsd/decoder/build/linux install
          sudo ldconfig
          echo "--- headers ---"; ls -l /usr/local/include/opencsd/ | head
          echo "--- libs ---";    ls -l /usr/local/lib/libopencsd* || true
          echo "--- version ---"; grep -n 'OCSD_VER_' /usr/local/include/opencsd/ocsd_if_version.h || true

      - name: Build perf with CoreSight/OpenCSD support
        run: |
          set -x
          # A released kernel.org tarball is a complete, self-consistent tree,
          # which is what tools/perf expects.  (A shallow clone of the Android
          # common kernel failed with "Inconsistent word size. Check
          # asm/bitsperlong.h".)
          curl -fL --retry 3 -o linux.tar.xz \
            https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.1.tar.xz
          ls -l linux.tar.xz
          tar xf linux.tar.xz
          cd linux-6.1/tools/perf

          # perf's Makefile.config uses CSINCLUDES / CSLIBS to locate OpenCSD and
          # hard-errors if it cannot find it, so a clean build already proves the
          # linkage.  Note: `perf version --build-options` does NOT print an
          # opencsd line in v6.1, so check the linkage directly instead.
          if ! make -j"$(nproc)" WERROR=0 CORESIGHT=1 \
                     CSINCLUDES=/usr/local/include CSLIBS=/usr/local/lib \
                     VF=1 NO_PYTHON=1 > build.log 2>&1; then
            echo "!! perf build FAILED"
            grep -n -i -E 'libopencsd|error|Error' build.log | head -30
            tail -60 build.log
            exit 1
          fi
          echo "=== detection lines ==="
          grep -n -i -E 'libopencsd|CORESIGHT' build.log | head -20
          tail -10 build.log
          ls -l perf
          ./perf version
          ./perf version --build-options | tee "$GITHUB_WORKSPACE/build-options.txt"

          echo "=== linkage check ==="
          ldd ./perf | grep -i opencsd || {
            echo "!! perf is NOT linked against OpenCSD"; exit 1; }
          echo "OK: perf is linked against OpenCSD"

      - name: Fetch trace from release asset
        run: |
          ASSET="${{ inputs.asset }}"
          URL="https://github.com/lin293387-del/shennong-coresight-etm4x/releases/download/trace-v1/${ASSET}"
          echo "downloading $URL"
          curl -fL --retry 3 -o "$ASSET" "$URL"
          ls -l "$ASSET"; sha256sum "$ASSET"
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"

      - name: Decode -- packet dump
        run: |
          set +e
          PERF=./linux-6.1/tools/perf/perf
          timeout 1200 $PERF report --stdio --dump -i "$ASSET" > dump.txt 2>&1
          echo "dump exit=$?  dump.txt size=$(stat -c%s dump.txt)"
          {
            echo "================= first 100 lines ================="
            head -100 dump.txt
            echo "================= key lines ================="
            grep -n -E 'CoreSight ETM Trace data|Frame deformatter|FSYNC|ID:[0-9a-f]+|I_ASYNC|I_TRACE_INFO|I_TRACE_ON|I_CTXT|RESET|Trace buffer done' dump.txt | head -40
            echo "================= packet census ================="
            grep -o -E 'I_[A-Z_0-9]+' dump.txt | sort | uniq -c | sort -rn | head -30
            echo "================= element census ================="
            grep -o -E 'OCSD_GEN_TRC_ELEM_[A-Z_]+' dump.txt | sort | uniq -c | sort -rn | head -20
          } | tee dump-head.txt

      - name: Decode -- perf inject instruction samples + branch history
        run: |
          set +e
          PERF=./linux-6.1/tools/perf/perf
          timeout 1200 $PERF inject -i "$ASSET" -o inj.data --itrace=${{ inputs.itrace }} -v > inject.log 2>&1
          echo "inject exit=$?"
          tail -40 inject.log
          ls -l inj.data 2>/dev/null
          echo "================= perf report --header-only ================="
          $PERF report --stdio -i inj.data --header-only 2>&1 | head -20
          echo "================= perf report ================="
          $PERF report --stdio -i inj.data 2>&1 | head -40
          echo "================= perf script ================="
          $PERF script -i inj.data 2>&1 | head -30
          echo "================= perf report --stats ================="
          $PERF report --stdio -i inj.data --stats 2>&1 | head -30

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decode-results
          path: |
            dump-head.txt
            inject.log
            inj.data
            build-options.txt
          if-no-files-found: warn
          retention-days: 14
