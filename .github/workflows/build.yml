name: Build coresight-etm4x.ko (shennong / SM8650)

# Builds the missing APSS ETE/ETMv4 driver module for the Xiaomi 14 Pro
# (shennong / SM8650) from Xiaomi's own OSS source, then packages it as a
# KernelSU / Magisk module.
#
# See README.md for the full rationale; the short version:
#
#   * pineapple_GKI.config (the config that produced the shipped /vendor_dlkm)
#     enables 13 CONFIG_CORESIGHT_* symbols but NOT
#     CONFIG_CORESIGHT_SOURCE_ETM4X, which only appears in the internal debug
#     variant pineapple_consolidate.config.  Hence the DT nodes ete0..7 have no
#     driver and `cs_etm` ends up with zero CPUs.
#
#   * kernel/module/version.c :: same_magic() ignores the version prefix of the
#     vermagic string when the module carries a __versions section, so a module
#     built here loads on the 6.1.138 device kernel even though this tree is
#     based on 6.1.25.
#
#   * kernel/module/version.c :: check_version() treats a recorded symbol CRC of
#     0 as a match, which is what tools/patch_modpost.py arranges.
#
#   * kernel/module/signing.c: with CONFIG_MODULE_SIG_PROTECT=y (device config)
#     signature enforcement is off, so an unsigned module loads.
#
# Xiaomi's OSS snapshot is incomplete (drivers/misc/hwid is referenced but not
# shipped), which tools/repair_tree.py fixes by stubbing the dangling Kconfig.

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

env:
  ARCH: arm64
  KERNEL_REPO: https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git
  KERNEL_BRANCH: shennong-u-oss
  CLANG_TAG: clang-r487747c
  CLANG_REF: android-14.0.0_r1
  SRC: kernel

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 200

    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache \
                      /usr/local/lib/node_modules /usr/share/swift
          sudo apt-get clean
          df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev cpio kmod rsync zip unzip \
            ccache zstd curl git-lfs
          git lfs install --skip-repo || true

      - name: Clone Xiaomi kernel source (${{ env.KERNEL_BRANCH }})
        run: |
          git clone --depth=1 --single-branch --branch "$KERNEL_BRANCH" \
            "$KERNEL_REPO" "$SRC"
          rm -rf "$SRC/.git"
          du -sh "$SRC"

      - name: Fetch AOSP clang ${{ env.CLANG_TAG }}
        run: |
          DEST="prebuilts/clang/host/linux-x86/${CLANG_TAG}"
          mkdir -p "$DEST"
          URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/${CLANG_REF}/${CLANG_TAG}.tar.gz"
          echo "downloading $URL"
          curl -fL --retry 3 -o /tmp/clang.tar.gz "$URL"
          tar -xzf /tmp/clang.tar.gz -C "$DEST"
          rm -f /tmp/clang.tar.gz
          echo "$PWD/$DEST/bin" >> "$GITHUB_PATH"
          "$DEST/bin/clang" --version

      - name: Repair incomplete vendor tree
        run: |
          set -x
          python3 tools/repair_tree.py "$SRC"

      - name: Patch modpost to emit CRC 0 for every symbol
        run: |
          set -x
          python3 tools/patch_modpost.py "$SRC/scripts/mod/modpost.c"
          sed -n '/static void add_versions/,/^}/p' "$SRC/scripts/mod/modpost.c"

      - name: Fix known vendor prototype drift
        run: |
          set -x
          USBH="$SRC/include/linux/usb/usb_qdss.h"
          TMCUSB="$SRC/drivers/hwtracing/coresight/coresight-tmc-usb.c"
          # coresight-tmc-usb.c still calls the 2-argument form of
          # usb_qdss_alloc_req() while the header in this snapshot declares the
          # 3-argument one.  We do not build coresight-tmc at all (TMC is left
          # out of the config fragment because CORESIGHT_SOURCE_ETM4X does not
          # select it), so this is only a belt-and-braces fix in case a future
          # config pulls the TMC driver back in.
          if grep -q 'usb_qdss_alloc_req(struct usb_qdss_ch \*c, int n_wr, int n_rd)' "$USBH" 2>/dev/null; then
            sed -i 's/usb_qdss_alloc_req(ch, USB_BUF_NUM)/usb_qdss_alloc_req(ch, USB_BUF_NUM, USB_BUF_NUM)/' "$TMCUSB"
            grep -n 'usb_qdss_alloc_req(ch' "$TMCUSB" || true
          else
            echo "header uses a different prototype - skipping"
          fi

      - name: Configure kernel
        run: |
          set -eux
          cd "$SRC"
          make ARCH=arm64 LLVM=1 O=out gki_defconfig
          printf '%s\n' \
            'CONFIG_CORESIGHT=m' \
            'CONFIG_CORESIGHT_SOURCE_ETM4X=m' \
            'CONFIG_MODULE_SIG_ALL=n' >> out/.config
          make ARCH=arm64 LLVM=1 O=out olddefconfig
          echo "----- coresight / modversion config -----"
          grep -E 'CORESIGHT|MODVERSIONS|MODULE_SIG|CFI_CLANG|^CONFIG_PREEMPT=|^CONFIG_SMP=|^CONFIG_MODULE_UNLOAD=' \
            out/.config | sort
          echo "-----------------------------------------"

      - name: Prepare build
        run: |
          set -eux
          cd "$SRC"
          make ARCH=arm64 LLVM=1 O=out -j"$(nproc)" modules_prepare

      - name: Build coresight modules
        run: |
          set -eux
          cd "$SRC"
          KBUILD_MODPOST_WARN=1 make ARCH=arm64 LLVM=1 O=out \
            -j"$(nproc)" M=drivers/hwtracing/coresight || \
          KBUILD_MODPOST_WARN=1 make ARCH=arm64 LLVM=1 O=out \
            -j"$(nproc)" M=drivers/hwtracing/coresight modules

      - name: Locate and inspect the module
        run: |
          set -eux
          cd "$SRC"
          echo "----- every module that was built -----"
          find . -name '*.ko' -printf '%p  %s bytes\n' | sort
          KO=$(find . -name 'coresight-etm4x.ko' -print -quit)
          test -n "$KO"
          echo "KO=$KO"
          ls -l "$KO"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$KO" "$GITHUB_WORKSPACE/dist/coresight-etm4x.ko"
          echo "----- vermagic -----"
          strings "$KO" | grep -i '^vermagic=' || true
          echo "----- __versions -----"
          python3 "$GITHUB_WORKSPACE/tools/modversions.py" dump \
            "$GITHUB_WORKSPACE/dist/coresight-etm4x.ko" | head -25
          echo "----- sections -----"
          strings "$KO" | grep -iE 'coresight-etm4x|kcfi|__cfi' | head -10 || true

      - name: Verify __versions is present
        run: |
          set -eux
          cd "$GITHUB_WORKSPACE"
          if python3 tools/modversions.py dump dist/coresight-etm4x.ko | grep -q 'NO __versions'; then
            echo "::error::module has no __versions section; same_magic() would compare the full vermagic and the module would be rejected"
            exit 1
          fi
          cp dist/coresight-etm4x.ko dist/coresight-etm4x-crc0.ko
          python3 tools/modversions.py zero dist/coresight-etm4x-crc0.ko
          python3 tools/modversions.py dump dist/coresight-etm4x-crc0.ko | head -10

      - name: Compare against the device's own coresight.ko
        run: |
          set +e
          if [ -f refs/coresight.ko ]; then
            python3 tools/modversions.py compare refs/coresight.ko \
              --target dist/coresight-etm4x.ko | tail -30
          else
            echo "no reference module committed"
          fi
          exit 0

      - name: Package KernelSU / Magisk module zip
        run: |
          set -eux
          cd "$GITHUB_WORKSPACE"
          cp dist/coresight-etm4x-crc0.ko ksu-module/coresight-etm4x.ko
          chmod +x ksu-module/post-fs-data.sh ksu-module/service.sh
          ( cd ksu-module && zip -r9 "$GITHUB_WORKSPACE/dist/ksu-coresight-etm4x.zip" . )
          unzip -l dist/ksu-coresight-etm4x.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coresight-etm4x
          path: |
            dist/coresight-etm4x.ko
            dist/coresight-etm4x-crc0.ko
            dist/ksu-coresight-etm4x.zip
          if-no-files-found: error
          retention-days: 30
