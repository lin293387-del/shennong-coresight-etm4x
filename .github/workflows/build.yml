name: Build coresight-etm4x.ko (shennong / SM8650, ACK 6.1.138)

# Builds the missing APSS ETE/ETMv4 driver module for the Xiaomi 14 Pro
# (shennong / SM8650, HyperOS OS3.0.306.0.WNBCNXM, kernel
# 6.1.138-android14-11-g0c3d559bcd85-ab14529422) and packages it as a
# KernelSU / Magisk module.
#
# ---------------------------------------------------------------------------
# Why the previous revision crashed the phone (fixed here)
# ---------------------------------------------------------------------------
# It was built from Xiaomi's 6.1.25 OSS snapshot with `gki_defconfig` + 3 lines.
# gki_defconfig has CONFIG_DEBUG_INFO_BTF=y but NOT
# CONFIG_DEBUG_INFO_BTF_MODULES=y; the shipping kernel has it =y (verified in the
# device's own /proc/config.gz).  That switch adds, to `struct module`:
#
#     #ifdef CONFIG_DEBUG_INFO_BTF_MODULES
#             unsigned int btf_data_size;     /* +0x348 */
#             void *btf_data;                 /* +0x350 */
#     #endif
#
# i.e. +16 bytes right after bpf_raw_events, before jump_entries.  Measured from
# the device's own /sys/kernel/btf/vmlinux:
#
#     kernel sizeof(struct module)        = 1088      (previous build: 1024)
#     kernel offsetof(., name)            = 0x18      (same)
#     kernel offsetof(., mkobj)           = 0x50      (same)
#     kernel offsetof(., holders_dir)     = 0xf0      (same)
#     kernel offsetof(., init)            = 0x170     (same)
#     kernel offsetof(., source_list)     = 0x3b8     (ours: 0x3a8)
#     kernel offsetof(., target_list)     = 0x3c8     (ours: 0x3b8)
#     kernel offsetof(., exit)            = 0x3d8     (ours: 0x3c8)
#
# The module's own relocation `__this_module.exit = cleanup_module` therefore
# landed on the kernel's `target_list.next` (0x3c8).  add_usage_links() walked
# module .text bytes as a `struct module_use`, read a garbage ->target and
# faulted at target->holders_dir -> Oops -> panic -> the Qualcomm/Gunyah watchdog
# reset the SoC ~663 ms later.
#
# Nothing in the loader validates `.gnu.linkonce.this_module` size (only
# find_sec() mentions it), and the `module_layout` CRC - the sole struct-module
# guard - passed because the CRC had been copied from the device's own modules.
# Hence the hard "ABI gate" step below: it must pass before anything is published.
#
# ---------------------------------------------------------------------------
# What this revision does differently
# ---------------------------------------------------------------------------
# 1. Builds against the *exact* kernel the device runs:
#    kernel/common (ACK) android14-6.1 @ 0c3d559bcd85c64dae9c9c9687abbe5347fff3ad
#    (its committer date, 2025-12-02 18:05:30 -0800, matches the kernel banner
#    "Wed Dec 3 02:05:30 UTC 2025").  No more 6.1.25 vendor snapshot, so
#    tools/repair_tree.py and the coresight-tmc-usb prototype patch are gone.
# 2. Takes the configuration from the DEVICE (refs/device.config, harvested with
#    `zcat /proc/config.gz`), which keeps CONFIG_DEBUG_INFO_BTF_MODULES=y and
#    every other ABI-relevant switch (CFI_CLANG, SHADOW_CALL_STACK, LTO_NONE,
#    MODVERSIONS, ...).  A fallback path builds gki_defconfig plus the switches we
#    know about, but that path is only a guess - the gate decides.
# 3. Skips the vmlinux build: for `M=` builds scripts/Makefile.modfinal drops the
#    vmlinux prerequisite and the BTF step prints
#    "Skipping BTF generation ... due to unavailability of vmlinux".
#    The +16 bytes of struct module come from the *config*, not from BTF
#    generation, so the ABI is unaffected by skipping it.
# 4. "ABI gate" step: tools/preflight.py refuses to publish a module whose
#    sizeof(struct module) / relocation offsets / kCFI instrumentation differ from
#    the device's own modules.

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

env:
  ARCH: arm64
  ACK_ARCHIVE: https://android.googlesource.com/kernel/common/+archive
  ACK_REPO: https://android.googlesource.com/kernel/common
  ACK_BRANCH: android14-6.1
  ACK_COMMIT: 0c3d559bcd85c64dae9c9c9687abbe5347fff3ad
  CLANG_TAG: clang-r487747c
  CLANG_REF: android-14.0.0_r1
  SRC: kernel

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -eux
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev cpio kmod rsync zip unzip \
            ccache zstd curl git dwarves
          # dwarves = pahole.  It is NOT optional here: lib/Kconfig.debug has
          #     config DEBUG_INFO_BTF_MODULES
          #             bool "..." ; default y
          #             depends on DEBUG_INFO_BTF && MODULES && PAHOLE_HAS_SPLIT_BTF
          #     config PAHOLE_HAS_SPLIT_BTF
          #             def_bool PAHOLE_VERSION >= 119
          # and init/Kconfig derives PAHOLE_VERSION from
          #     $(shell,$(srctree)/scripts/pahole-version.sh $(PAHOLE))
          # With no pahole in PATH that shell returns 0, PAHOLE_HAS_SPLIT_BTF
          # becomes n, DEBUG_INFO_BTF_MODULES becomes *invisible*, and
          # `make olddefconfig` deletes the line from .config entirely (not even
          # a "# ... is not set" comment).  Result: sizeof(struct module)==1024
          # instead of the device's 1088 -- exactly the crash this file fixes.
          df -h / | tail -1
          pahole --version

      - name: Fetch ACK android14-6.1 @ ${{ env.ACK_COMMIT }}
        run: |
          set -eux
          mkdir -p "$SRC"
          if curl -fL --retry 3 -o /tmp/ack.tar.gz \
               "$ACK_ARCHIVE/${ACK_COMMIT}.tar.gz"; then
            tar -xzf /tmp/ack.tar.gz -C "$SRC"
          else
            echo "::warning::gitiles archive failed, falling back to a git clone"
            git clone --depth=1 --single-branch --branch "$ACK_BRANCH" "$ACK_REPO" "$SRC"
            if ! git -C "$SRC" cat-file -e "${ACK_COMMIT}^{commit}" 2>/dev/null; then
              echo "::warning::exact commit not available, using branch tip"
            else
              git -C "$SRC" checkout -q "$ACK_COMMIT"
            fi
            rm -rf "$SRC/.git"
          fi
          echo "kernel tree: $(du -sh "$SRC" | cut -f1)"
          grep -m1 -E '^(VERSION|PATCHLEVEL|SUBLEVEL) =' "$SRC/Makefile" || true
          test -f "$SRC/drivers/hwtracing/coresight/coresight-etm4x-core.c"
          # the ETE + Qualcomm hooks the shennong DT needs must be in this tree
          grep -c 'arm,embedded-trace-extension' "$SRC/drivers/hwtracing/coresight/coresight-etm4x-core.c"
          grep -c 'qcom,skip-power-up' "$SRC/drivers/hwtracing/coresight/coresight-etm4x-core.c"

      - name: Fetch AOSP clang ${{ env.CLANG_TAG }}
        run: |
          set -eux
          DEST="prebuilts/clang/host/linux-x86/${CLANG_TAG}"
          mkdir -p "$DEST"
          URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/${CLANG_REF}/${CLANG_TAG}.tar.gz"
          curl -fL --retry 3 -o /tmp/clang.tar.gz "$URL"
          tar -xzf /tmp/clang.tar.gz -C "$DEST"
          rm -f /tmp/clang.tar.gz
          echo "$PWD/$DEST/bin" >> "$GITHUB_PATH"
          "$DEST/bin/clang" --version

      - name: Configure kernel (device config first)
        run: |
          set -eux
          cd "$SRC"
          mkdir -p out
          if [ -s "$GITHUB_WORKSPACE/refs/device.config" ]; then
            echo "using refs/device.config (ground truth from the device)"
            cp "$GITHUB_WORKSPACE/refs/device.config" out/.config
          else
            echo "::warning::refs/device.config missing - falling back to gki_defconfig + guesses"
            make ARCH=arm64 LLVM=1 O=out gki_defconfig
            printf '%s\n' 'CONFIG_DEBUG_INFO_BTF_MODULES=y' >> out/.config
          fi
          # the one switch that is actually missing from the shipping config,
          # plus signing cosmetics (CONFIG_MODULE_SIG_PROTECT already disables
          # enforcement on the device)
          ./scripts/config --file out/.config --module CORESIGHT
          ./scripts/config --file out/.config --module CORESIGHT_SOURCE_ETM4X
          ./scripts/config --file out/.config --disable MODULE_SIG_ALL
          # LOCALVERSION is only cosmetic: same_magic() drops the first token when
          # the module carries __versions.  Make it match anyway.
          LOCALVERSION="-android14-11" make ARCH=arm64 LLVM=1 O=out olddefconfig
          echo "----- pahole (drives PAHOLE_HAS_SPLIT_BTF >= 119) -----"
          command -v pahole || echo "::error::pahole missing from PATH"
          ./scripts/pahole-version.sh pahole || true
          grep -E '^CONFIG_DEBUG_INFO_BTF(_MODULES)?=|^# CONFIG_DEBUG_INFO_BTF' out/.config || true
          echo "----- ABI-relevant switches -----"
          grep -E '^(CONFIG_(DEBUG_INFO_BTF|DEBUG_INFO_BTF_MODULES|CFI_CLANG|LTO_NONE|LTO_CLANG[A-Z_]*|SHADOW_CALL_STACK|MODVERSIONS|MODULE_UNLOAD|MODULE_SIG|MODULE_SIG_PROTECT|MODULE_FORCE_LOAD|TRACEPOINTS|BPF_EVENTS|JUMP_LABEL|FTRACE_MCOUNT_RECORD|KPROBES|LIVEPATCH|KUNIT|IKCONFIG|PANIC_ON_OOPS|PANIC_TIMEOUT|CORESIGHT[A-Z_]*)=|# CONFIG_(DEBUG_INFO_BTF_MODULES|CFI_CLANG|SHADOW_CALL_STACK) is not set)' out/.config | sort
          echo "---------------------------------"
          grep -q '^CONFIG_DEBUG_INFO_BTF_MODULES=y' out/.config || {
            echo "::error::CONFIG_DEBUG_INFO_BTF_MODULES is not =y. The shipping kernel has it"
            echo "::error::enabled; without it sizeof(struct module) is 1024 instead of 1088 and the"
            echo "::error::module's exit relocation lands on the kernel's target_list.next (the Oops)."
            echo "----- diagnosis -----"
            echo "pahole: $(command -v pahole || echo MISSING)"
            ./scripts/pahole-version.sh pahole || true
            grep -n -A4 'config DEBUG_INFO_BTF_MODULES' lib/Kconfig.debug || true
            grep -n -A3 'config PAHOLE_HAS_SPLIT_BTF' lib/Kconfig.debug || true
            grep -n -A3 'config PAHOLE_VERSION' init/Kconfig || true
            grep -i pahole out/.config || echo "(no pahole symbols in .config at all - the symbol was dropped)"
            exit 1
          }
          grep -q '^CONFIG_CORESIGHT_SOURCE_ETM4X=m' out/.config || {
            echo "::error::CONFIG_CORESIGHT_SOURCE_ETM4X is not =m - nothing to build."; exit 1
          }
          grep -q '^CONFIG_CFI_CLANG=y' out/.config || {
            echo "::error::CONFIG_CFI_CLANG is not =y but the device kernel is kCFI; the kernel"
            echo "::error::would trap when calling into the module."; exit 1
          }

      - name: Prepare build
        run: |
          set -eux
          cd "$SRC"
          make ARCH=arm64 LLVM=1 O=out -j"$(nproc)" modules_prepare
          # Authoritative check: what kconfig *really* resolved, not what the
          # .config file claims.  A .config line can survive while syncconfig
          # drops the symbol because a dependency is unmet - that is exactly the
          # pahole trap this workflow documents.
          OUTC="out/include/generated/autoconf.h"
          grep -E '^#define CONFIG_(DEBUG_INFO_BTF_MODULES|PAHOLE_HAS_SPLIT_BTF|PAHOLE_VERSION|DEBUG_INFO_BTF|CFI_CLANG|SHADOW_CALL_STACK|MODVERSIONS|MODULE_UNLOAD) ' "$OUTC" | sort
          grep -q '^#define CONFIG_DEBUG_INFO_BTF_MODULES 1' "$OUTC" || {
            echo "::error::kconfig resolved CONFIG_DEBUG_INFO_BTF_MODULES to n even though the"
            echo "::error::.config line is present.  struct module would then be 16 bytes short"
            echo "::error::and the module would take the device down (see the file header)."
            exit 1
          }

      - name: ABI probe (cheap 5-line module, reports struct module layout early)
        run: |
          set -eux
          cd "$SRC"
          PROBE=/tmp/abiprobe
          mkdir -p "$PROBE"
          cat > "$PROBE/probe.c" <<'EOF'
          #include <linux/module.h>
          #include <linux/kernel.h>
          static int __init probe_init(void)
          {
          	pr_info("abiprobe: sizeof(struct module)=%zu init=%zu target_list=%zu exit=%zu\n",
          		sizeof(struct module), offsetof(struct module, init),
          		offsetof(struct module, target_list), offsetof(struct module, exit));
          	return 0;
          }
          static void __exit probe_exit(void) { }
          module_init(probe_init);
          module_exit(probe_exit);
          MODULE_LICENSE("GPL");
          EOF
          printf 'obj-m := probe.o\n' > "$PROBE/Makefile"
          # built BEFORE refs/kernel.symvers is installed, and as an external
          # module, so it cannot pollute out/Module.symvers.  Advisory only: the
          # post-build gate stays authoritative.
          KBUILD_MODPOST_WARN=1 make ARCH=arm64 LLVM=1 O=out LOCALVERSION="-android14-11" \
            -j"$(nproc)" M="$PROBE" modules \
            || echo "::warning::ABI probe build failed - continuing; the post-build gate decides"
          if [ -f "$PROBE/probe.ko" ]; then
            mkdir -p "$GITHUB_WORKSPACE/dist"
            cp "$PROBE/probe.ko" "$GITHUB_WORKSPACE/dist/probe.ko"
            python3 "$GITHUB_WORKSPACE/tools/preflight.py" "$PROBE/probe.ko" \
              --vendor "$GITHUB_WORKSPACE/refs/ref-coresight.ko" \
              || echo "::warning::ABI probe MISMATCH (numbers above) - the post-build gate will decide"
          else
            echo "::warning::probe.ko was not produced"
          fi

      - name: Install the device's symbol CRCs
        run: |
          set -eux
          # refs/kernel.symvers carries the CRCs the device kernel actually checks
          # (harvested from the vendor modules that already load there).  Symbols
          # that are absent from it stay unresolved, and check_version() accepts an
          # entry that is not listed at all.
          if [ -s "$GITHUB_WORKSPACE/refs/kernel.symvers" ]; then
            wc -l "$GITHUB_WORKSPACE/refs/kernel.symvers"
            cp "$GITHUB_WORKSPACE/refs/kernel.symvers" "$SRC/out/Module.symvers"
          else
            echo "::warning::refs/kernel.symvers missing - modpost will invent CRCs for"
            echo "::warning::module-provided symbols; the device will reject those imports."
          fi

      - name: Keep only the coresight-etm4x object
        run: |
          set -eux
          MF="$SRC/drivers/hwtracing/coresight/Makefile"
          # The device already ships coresight.ko, coresight-tmc.ko, funnel,
          # replicator, ...  Building them here would make modpost compute
          # genksyms CRCs for the symbols they export, which do not match the
          # device's modules ("disagrees about version of symbol coresight_register").
          sed -i -E '/^obj-\$\(CONFIG_/ {/coresight-etm4x/!s/^/# trimmed by CI: /}' "$MF"
          grep -n -E '^obj-|^# trimmed by CI|^coresight-etm4x-y' "$MF"

      - name: Build coresight-etm4x.ko
        run: |
          set -eux
          cd "$SRC"
          KBUILD_MODPOST_WARN=1 make ARCH=arm64 LLVM=1 O=out LOCALVERSION="-android14-11" \
            -j"$(nproc)" M=drivers/hwtracing/coresight modules
          KO=$(find out/drivers/hwtracing/coresight -name 'coresight-etm4x.ko' -print -quit)
          test -n "$KO"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$KO" "$GITHUB_WORKSPACE/dist/coresight-etm4x.ko"     # keep DWARF for the gate
          echo "----- vermagic -----"; strings "$KO" | grep -i '^vermagic=' || true
          echo "----- __versions -----"
          python3 "$GITHUB_WORKSPACE/tools/modversions.py" dump "$KO" | head -25

      - name: ABI gate (must pass before anything is published)
        run: |
          set -eux
          cd "$GITHUB_WORKSPACE"
          test -f refs/ref-coresight.ko || {
            echo "::error::refs/ref-coresight.ko is missing - it is the ground truth for"
            echo "::error::sizeof(struct module) and the exit offset.  Harvest it with"
            echo "::error::tools/collect_device_facts.sh and commit it."
            exit 1
          }
          python3 tools/preflight.py dist/coresight-etm4x.ko \
            --vendor refs/ref-coresight.ko --etm4x --strict-cfi
          if [ -f refs/vmlinux.btf ]; then
            python3 tools/preflight.py dist/coresight-etm4x.ko --btf refs/vmlinux.btf || true
          fi
          if python3 tools/modversions.py dump dist/coresight-etm4x.ko | grep -q 'NO __versions'; then
            echo "::error::module has no __versions section; same_magic() would compare the full"
            echo "::error::vermagic (release prefix included) and reject the module."
            exit 1
          fi

      - name: Strip debug info for the shipped copy
        run: |
          set -eux
          cd "$GITHUB_WORKSPACE"
          cp dist/coresight-etm4x.ko dist/coresight-etm4x-unstripped.ko
          llvm-objcopy --strip-debug dist/coresight-etm4x.ko
          ls -l dist/

      - name: Package KernelSU / Magisk module zip
        run: |
          set -eux
          cd "$GITHUB_WORKSPACE"
          cp dist/coresight-etm4x.ko ksu-module/coresight-etm4x.ko
          chmod +x ksu-module/post-fs-data.sh ksu-module/service.sh
          ( cd ksu-module && zip -r9 "$GITHUB_WORKSPACE/dist/ksu-coresight-etm4x.zip" . )
          unzip -l dist/ksu-coresight-etm4x.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coresight-etm4x
          path: |
            dist/coresight-etm4x.ko
            dist/coresight-etm4x-unstripped.ko
            dist/ksu-coresight-etm4x.zip
          if-no-files-found: error
          retention-days: 30
