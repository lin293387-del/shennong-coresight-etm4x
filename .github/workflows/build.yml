name: Build coresight-etm4x.ko (shennong / SM8650, vendor tree + device ABI)

# Builds the missing APSS ETE/ETMv4 driver module for the Xiaomi 14 Pro
# (shennong / SM8650, HyperOS OS3.0.306.0.WNBCNXM) and packages it as a
# KernelSU / Magisk module.
#
# ===========================================================================
# 1. Why the previous revision crashed the phone (and what actually fixes it)
# ===========================================================================
# It was built from Xiaomi's 6.1.25 OSS snapshot with `gki_defconfig` + 3 lines.
# gki_defconfig has CONFIG_DEBUG_INFO_BTF=y but NOT
# CONFIG_DEBUG_INFO_BTF_MODULES=y; the *device kernel* has it =y (verified in the
# device's own /proc/config.gz).  That switch adds, to the kernel's
# `struct module`:
#
#     #ifdef CONFIG_DEBUG_INFO_BTF_MODULES
#             unsigned int btf_data_size;     /* +0x348 */
#             void *btf_data;                 /* +0x350 */
#     #endif
#
# i.e. +16 bytes right after bpf_raw_events, before jump_entries.  Measured from
# the device's own /sys/kernel/btf/vmlinux and from the vendor .ko files:
#
#     kernel sizeof(struct module)        = 1088      (previous build: 1024)
#     kernel offsetof(., init)            = 0x170     (same)
#     kernel offsetof(., target_list)     = 0x3c8     (ours: 0x3b8)
#     kernel offsetof(., exit)            = 0x3d8     (ours: 0x3c8)
#
# The module's own relocation `__this_module.exit = cleanup_module` therefore
# landed on the kernel's `target_list.next` (0x3c8).  mod_sysfs_setup() ->
# add_usage_links() (static, inlined; kernel/module/sysfs.c:255/262/395) walked
# module .text bytes as a `struct module_use`, loaded a garbage ->target and
# faulted at use->target->holders_dir (ldr x0,[x8,#0xf0]) -> Oops -> panic ->
# the Gunyah watchdog reset the SoC 663 ms later:
#
#   [641.716013] pc : mod_sysfs_setup+0x208/0x418     x8 : 910ba000d0000040
#   [641.716058] Call trace: mod_sysfs_setup <- load_module <- finit_module
#   [641.716111] Kernel panic - not syncing: Oops: Fatal exception
#   [642.380500] gh-watchdog: Causing a QCOM Apps Watchdog bite! (663 ms)
#
# Nothing in the loader validates `.gnu.linkonce.this_module` size (only
# find_sec() mentions it, kernel/module/main.c:1925), and the `module_layout` CRC
# - the sole struct-module guard - passed because the CRC had been copied from
# the device's own modules.  Hence the hard ABI gate below.
#
# FIX = the same vendor source, compiled with the DEVICE's own config.  Nothing
# in the kernel, the DTB or the boot chain has to change.
#
# ===========================================================================
# 2. Why this builds from the VENDOR tree and not from ACK (android14-6.1)
# ===========================================================================
# The running *kernel* is ACK android14-6.1 @ 0c3d559bcd85 (the banner says
# 6.1.138-android14-11-g0c3d559bcd85-ab14529422 and that commit's date matches
# it), but the CoreSight modules on the device are NOT from ACK: they are
# vendor_dlkm modules built from Qualcomm/Xiaomi's tree (their vermagic says
# 6.1.68-android14-11-maybe-dirty, they export cscfg_* and etm_perf_symlink,
# and they do not carry the "(O)" out-of-tree flag in `Modules linked in:`).
#
# A module built from ACK's coresight-etm4x-core.c therefore CANNOT bind to the
# device's coresight.ko: ACK's driver calls
#
#     extern int coresight_timeout_action(struct csdev_access *, u32, int, int,
#                                         coresight_timeout_cb_t);   /* coresight.h */
#
# and that symbol exists nowhere on the device:
#
#     $ grep __ksymtab_coresight_timeout_action  <device /proc/kallsyms>   -> none
#     $ grep -w coresight_timeout_action         <device /proc/kallsyms>   -> none
#
# `insmod` would fail with "Unknown symbol coresight_timeout_action (err -2)".
# The vendor tree's driver, built with the device config, imports only symbols
# the device already exports - which is exactly what the vendor's own
# coresight.ko does (the ABI baseline committed as refs/ref-coresight.ko:
# this_module = 1088, cleanup_module @ 0x3d8, i.e. it loads on this kernel).
#
# The ABI comes from the CONFIG, not from the tree: refs/device.config is the
# device kernel's own /proc/config.gz, so `struct module` and every other shared
# layout come out identical, and the gate below verifies that byte for byte.
#
# ===========================================================================
# 3. Build traps that are not obvious (all four were hit for real)
# ===========================================================================
# * pahole must exist.  CONFIG_DEBUG_INFO_BTF_MODULES depends on
#   PAHOLE_HAS_SPLIT_BTF <- PAHOLE_VERSION <- scripts/pahole-version.sh.  With no
#   pahole in PATH that shell returns 0, the symbol becomes *invisible* and
#   `make olddefconfig` deletes the line from .config entirely (not even a
#   "# ... is not set" comment) -> struct module shrinks back to 1024 -> the
#   crash above comes back.  Verified check: include/generated/autoconf.h.
# * `abi_symbollist.raw` must exist (an empty file is fine): the device config
#   sets CONFIG_TRIM_UNUSED_KSYMS=y and CONFIG_UNUSED_KSYMS_WHITELIST to that
#   file, and scripts/gen_autoksyms.sh hard-fails when it is missing.  It is a
#   generated artifact of the full GKI build, irrelevant to a single M= module.
# * CONFIG_WERROR=y is disabled for this build: it does not change the generated
#   ABI, and there is no evidence this driver is warning-free with this clang.
# * "exported" != "present in /proc/kallsyms" (CONFIG_TRIM_UNUSED_KSYMS=y), so
#   the import gate checks the module's undefined symbols against the device's
#   __ksymtab_* export list harvested into refs/exported-symbols.txt.
#
# ===========================================================================
# 4. Gates (nothing is published unless these pass)
# ===========================================================================
#   preflight.py  : this_module == 1088, no relocation on a foreign member,
#                   cleanup_module @ 0x3d8, kCFI present, DT match strings
#   import_gate.py: every imported symbol is exported by the device
#   autoconf.h    : kconfig really enabled CONFIG_DEBUG_INFO_BTF_MODULES

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

env:
  ARCH: arm64
  KERNEL_REPO: https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git
  KERNEL_BRANCH: shennong-u-oss
  CLANG_TAG: clang-r487747c
  CLANG_REF: android-14.0.0_r1
  SRC: kernel

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 200

    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache \
                      /usr/local/lib/node_modules /usr/share/swift
          sudo apt-get clean
          df -h /

      - name: Install dependencies
        run: |
          set -eux
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev cpio kmod rsync zip unzip \
            ccache zstd curl git-lfs dwarves python3-pyelftools
          # dwarves = pahole.  NOT optional: without it
          # CONFIG_DEBUG_INFO_BTF_MODULES silently disappears from .config and
          # sizeof(struct module) drops from the device's 1088 to 1024, which is
          # the exact crash this workflow exists to prevent (see the header).
          # python3-pyelftools is what tools/preflight.py parses the ELF with
          # (without it the gate dies with ModuleNotFoundError: elftools).
          git lfs install --skip-repo || true
          pahole --version
          # fail fast if either gate dependency is missing
          python3 -c 'import elftools, sys; print("pyelftools OK")'
          df -h / | tail -1

      - name: Clone the vendor kernel source (${{ env.KERNEL_BRANCH }})
        run: |
          set -eux
          git clone --depth=1 --single-branch --branch "$KERNEL_BRANCH" \
            "$KERNEL_REPO" "$SRC"
          rm -rf "$SRC/.git"
          du -sh "$SRC"
          grep -m1 -E '^(VERSION|PATCHLEVEL|SUBLEVEL) =' "$SRC/Makefile" || true
          test -f "$SRC/drivers/hwtracing/coresight/coresight-etm4x-core.c"
          grep -c 'arm,embedded-trace-extension' "$SRC/drivers/hwtracing/coresight/coresight-etm4x-core.c"
          grep -c 'qcom,skip-power-up' "$SRC/drivers/hwtracing/coresight/coresight-etm4x-core.c"
          echo "----- the vendor tree calls the same helpers coresight.ko exports -----"
          grep -n -E 'etm_perf_symlink|coresight_timeout_action|coresight_trace_id_' \
            "$SRC/drivers/hwtracing/coresight/coresight-etm4x-core.c" || true
          echo "----- vendor CoreSight config fragments -----"
          grep -h -E 'CORESIGHT' \
            "$SRC/arch/arm64/configs/vendor/pineapple_GKI.config" \
            "$SRC/arch/arm64/configs/vendor/shennong_GKI.config" 2>/dev/null | sort -u || true

      - name: Fetch AOSP clang ${{ env.CLANG_TAG }}
        run: |
          set -eux
          DEST="prebuilts/clang/host/linux-x86/${CLANG_TAG}"
          mkdir -p "$DEST"
          URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/${CLANG_REF}/${CLANG_TAG}.tar.gz"
          curl -fL --retry 3 -o /tmp/clang.tar.gz "$URL"
          tar -xzf /tmp/clang.tar.gz -C "$DEST"
          rm -f /tmp/clang.tar.gz
          echo "$PWD/$DEST/bin" >> "$GITHUB_PATH"
          "$DEST/bin/clang" --version

      - name: Repair incomplete vendor tree
        run: |
          set -eux
          # Xiaomi's OSS snapshot references drivers/misc/hwid but does not ship
          # it; repair_tree.py stubs the dangling Kconfig source.
          python3 tools/repair_tree.py "$SRC"

      - name: Fix known vendor prototype drift
        run: |
          set -eux
          USBH="$SRC/include/linux/usb/usb_qdss.h"
          TMCUSB="$SRC/drivers/hwtracing/coresight/coresight-tmc-usb.c"
          # coresight-tmc-usb.c still calls the 2-argument form of
          # usb_qdss_alloc_req() while the header declares the 3-argument one.
          # We do not build coresight-tmc at all, so this is belt and braces.
          if grep -q 'usb_qdss_alloc_req(struct usb_qdss_ch \*c, int n_wr, int n_rd)' "$USBH" 2>/dev/null; then
            sed -i 's/usb_qdss_alloc_req(ch, USB_BUF_NUM)/usb_qdss_alloc_req(ch, USB_BUF_NUM, USB_BUF_NUM)/' "$TMCUSB"
            grep -n 'usb_qdss_alloc_req(ch' "$TMCUSB" || true
          else
            echo "header uses a different prototype - skipping"
          fi

      - name: Configure kernel (device config = the ABI source of truth)
        run: |
          set -eux
          cd "$SRC"
          mkdir -p out
          test -s "$GITHUB_WORKSPACE/refs/device.config" || {
            echo "::error::refs/device.config is required: it is the device's own"
            echo "::error::/proc/config.gz and defines the struct module ABI."
            exit 1
          }
          cp "$GITHUB_WORKSPACE/refs/device.config" out/.config
          echo "device config: $(wc -l < out/.config) lines"

          # The vendor's own CoreSight switches (their vendor_dlkm build uses
          # these two fragments), so the driver sees the same feature set it was
          # written for.  Only CORESIGHT* lines are taken.
          for f in arch/arm64/configs/vendor/pineapple_GKI.config \
                   arch/arm64/configs/vendor/shennong_GKI.config; do
            if [ -f "$f" ]; then
              grep -E '^CONFIG_CORESIGHT' "$f" >> out/.config || true
            fi
          done
          ./scripts/config --file out/.config --module CORESIGHT
          ./scripts/config --file out/.config --module CORESIGHT_SOURCE_ETM4X
          ./scripts/config --file out/.config --disable MODULE_SIG_ALL
          # WERROR does not change the generated ABI, and the device's GKI build
          # never compiled this driver, so there is no evidence it is warning-free.
          ./scripts/config --file out/.config --disable WERROR
          # ACK/GKI build plumbing: scripts/gen_autoksyms.sh hard-fails when the
          # CONFIG_UNUSED_KSYMS_WHITELIST file is missing.  It is generated by the
          # full GKI build and only decides which vmlinux exports survive
          # trimming - a vmlinux concern we never build here.
          : > abi_symbollist.raw
          LOCALVERSION="-android14-11" make ARCH=arm64 LLVM=1 O=out olddefconfig

          echo "----- pahole (drives PAHOLE_HAS_SPLIT_BTF >= 119) -----"
          command -v pahole || echo "::error::pahole missing from PATH"
          ./scripts/pahole-version.sh pahole || true
          echo "----- ABI-relevant switches -----"
          grep -E '^(CONFIG_(DEBUG_INFO_BTF|DEBUG_INFO_BTF_MODULES|PAHOLE_HAS_SPLIT_BTF|PAHOLE_VERSION|CFI_CLANG|LTO_NONE|LTO_CLANG[A-Z_]*|SHADOW_CALL_STACK|MODVERSIONS|MODULE_UNLOAD|MODULE_SIG|MODULE_SIG_PROTECT|MODULE_FORCE_LOAD|TRACEPOINTS|BPF_EVENTS|JUMP_LABEL|KPROBES|CORESIGHT[A-Z_]*|STACKPROTECTOR[A-Z_]*)=|# CONFIG_(DEBUG_INFO_BTF_MODULES|CFI_CLANG|SHADOW_CALL_STACK) is not set)' out/.config | sort
          echo "---------------------------------"
          grep -q '^CONFIG_DEBUG_INFO_BTF_MODULES=y' out/.config || {
            echo "::error::CONFIG_DEBUG_INFO_BTF_MODULES is not =y. The device kernel has it"
            echo "::error::enabled; without it sizeof(struct module) is 1024 instead of 1088 and"
            echo "::error::the module's exit relocation lands on target_list.next (the Oops)."
            echo "----- diagnosis -----"
            echo "pahole: $(command -v pahole || echo MISSING)"
            ./scripts/pahole-version.sh pahole || true
            grep -n -A4 'config DEBUG_INFO_BTF_MODULES' lib/Kconfig.debug || true
            grep -n -A3 'config PAHOLE_HAS_SPLIT_BTF' lib/Kconfig.debug || true
            grep -i pahole out/.config || echo "(no pahole symbols in .config - the symbol was dropped)"
            exit 1
          }
          grep -q '^CONFIG_CORESIGHT_SOURCE_ETM4X=m' out/.config || {
            echo "::error::CONFIG_CORESIGHT_SOURCE_ETM4X is not =m - nothing to build."; exit 1
          }
          grep -q '^CONFIG_CFI_CLANG=y' out/.config || {
            echo "::error::CONFIG_CFI_CLANG is not =y but the device kernel is kCFI; the kernel"
            echo "::error::would trap when calling into the module."; exit 1
          }

      - name: Prepare build
        run: |
          set -eux
          cd "$SRC"
          make ARCH=arm64 LLVM=1 O=out -j"$(nproc)" modules_prepare
          # Authoritative check: what kconfig *really* resolved, not what the
          # .config file claims (a .config line can survive while syncconfig drops
          # the symbol because a dependency is unmet - the pahole trap).
          OUTC="out/include/generated/autoconf.h"
          grep -E '^#define CONFIG_(DEBUG_INFO_BTF_MODULES|PAHOLE_HAS_SPLIT_BTF|PAHOLE_VERSION|DEBUG_INFO_BTF|CFI_CLANG|SHADOW_CALL_STACK|MODVERSIONS|MODULE_UNLOAD) ' "$OUTC" | sort
          grep -q '^#define CONFIG_DEBUG_INFO_BTF_MODULES 1' "$OUTC" || {
            echo "::error::kconfig resolved CONFIG_DEBUG_INFO_BTF_MODULES to n even though the"
            echo "::error::.config line is present.  struct module would be 16 bytes short and the"
            echo "::error::module would take the device down (see the file header)."
            exit 1
          }

      - name: ABI probe (cheap 5-line module, reports struct module layout early)
        run: |
          set -eux
          cd "$SRC"
          PROBE=/tmp/abiprobe
          mkdir -p "$PROBE"
          cat > "$PROBE/probe.c" <<'EOF'
          #include <linux/module.h>
          #include <linux/kernel.h>
          static int __init probe_init(void)
          {
          	pr_info("abiprobe: sizeof(struct module)=%zu init=%zu target_list=%zu exit=%zu\n",
          		sizeof(struct module), offsetof(struct module, init),
          		offsetof(struct module, target_list), offsetof(struct module, exit));
          	return 0;
          }
          static void __exit probe_exit(void) { }
          module_init(probe_init);
          module_exit(probe_exit);
          MODULE_LICENSE("GPL");
          EOF
          printf 'obj-m := probe.o\n' > "$PROBE/Makefile"
          # built BEFORE refs/kernel.symvers is installed, and as an external
          # module, so it cannot pollute out/Module.symvers.  Advisory only: the
          # post-build gate stays authoritative.
          KBUILD_MODPOST_WARN=1 make ARCH=arm64 LLVM=1 O=out LOCALVERSION="-android14-11" \
            -j"$(nproc)" M="$PROBE" modules \
            || echo "::warning::ABI probe build failed - continuing; the post-build gate decides"
          if [ -f "$PROBE/probe.ko" ]; then
            mkdir -p "$GITHUB_WORKSPACE/dist"
            cp "$PROBE/probe.ko" "$GITHUB_WORKSPACE/dist/probe.ko"
            python3 "$GITHUB_WORKSPACE/tools/preflight.py" "$PROBE/probe.ko" \
              --vendor "$GITHUB_WORKSPACE/refs/ref-coresight.ko" \
              || echo "::warning::ABI probe MISMATCH (numbers above) - the post-build gate will decide"
          else
            echo "::warning::probe.ko was not produced"
          fi

      - name: Install the device's symbol CRCs
        run: |
          set -eux
          # refs/kernel.symvers carries the CRCs the device kernel actually checks
          # (harvested from the vendor modules that already load there).  Symbols
          # absent from it stay unresolved, and check_version() accepts an entry
          # that is not listed at all - see the module/kernel log line
          # "kernelsu: no symbol version for module_layout" on the device.
          if [ -s "$GITHUB_WORKSPACE/refs/kernel.symvers" ]; then
            wc -l "$GITHUB_WORKSPACE/refs/kernel.symvers"
            cp "$GITHUB_WORKSPACE/refs/kernel.symvers" "$SRC/out/Module.symvers"
          else
            echo "::warning::refs/kernel.symvers missing - modpost will invent CRCs for"
            echo "::warning::module-provided symbols; the device will reject those imports."
          fi

      - name: Keep only the coresight-etm4x object
        run: |
          set -eux
          MF="$SRC/drivers/hwtracing/coresight/Makefile"
          # modpost computes the CRC of a symbol exported by a module built in the
          # same run with genksyms from this tree's headers; that value is not the
          # one the device's coresight.ko publishes, so importing
          # coresight_register would be recorded with a CRC the kernel rejects
          # ("disagrees about version of symbol coresight_register").  Leaving
          # those modules out keeps their symbols unresolved, modpost then skips
          # the entry, and check_version() accepts a symbol that is not listed.
          sed -i -E '/^obj-\$\(CONFIG_/ {/coresight-etm4x/!s/^/# trimmed by CI: /}' "$MF"
          grep -n -E '^obj-|^# trimmed by CI|^coresight-etm4x-y' "$MF"

      - name: Build coresight-etm4x.ko
        run: |
          set -eux
          cd "$SRC"
          KBUILD_MODPOST_WARN=1 make ARCH=arm64 LLVM=1 O=out LOCALVERSION="-android14-11" \
            -j"$(nproc)" M=drivers/hwtracing/coresight modules
          KO=$(find out/drivers/hwtracing/coresight -name 'coresight-etm4x.ko' -print -quit)
          test -n "$KO"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$KO" "$GITHUB_WORKSPACE/dist/coresight-etm4x.ko"     # keep DWARF for the gate
          echo "----- vermagic -----"; strings "$KO" | grep -i '^vermagic=' || true
          echo "----- __versions -----"
          python3 "$GITHUB_WORKSPACE/tools/modversions.py" dump "$KO" | head -25

      - name: ABI gate (must pass before anything is published)
        run: |
          set -eux
          cd "$GITHUB_WORKSPACE"
          test -f refs/ref-coresight.ko || {
            echo "::error::refs/ref-coresight.ko is missing - it is the ground truth for"
            echo "::error::sizeof(struct module) and the exit offset (the device's own"
            echo "::error::coresight.ko, which loads fine on this kernel)."
            exit 1
          }
          python3 tools/preflight.py dist/coresight-etm4x.ko \
            --vendor refs/ref-coresight.ko --etm4x --strict-cfi
          if [ -f refs/vmlinux.btf ]; then
            python3 tools/preflight.py dist/coresight-etm4x.ko --btf refs/vmlinux.btf || true
          fi
          # every symbol we import must be *exported* by the device kernel or by a
          # module already loaded there - CONFIG_TRIM_UNUSED_KSYMS=y means a symbol
          # can exist in /proc/kallsyms yet not be in the export table, which is
          # exactly how the ACK-source approach would have failed on
          # coresight_timeout_action.
          if [ -f refs/exported-symbols.txt ]; then
            python3 tools/import_gate.py dist/coresight-etm4x.ko refs/exported-symbols.txt
          else
            echo "::warning::refs/exported-symbols.txt missing - skipping the import gate"
          fi
          if python3 tools/modversions.py dump dist/coresight-etm4x.ko | grep -q 'NO __versions'; then
            echo "::error::module has no __versions section; same_magic() would compare the full"
            echo "::error::vermagic (release prefix included) and reject the module."
            exit 1
          fi

      - name: Strip debug info for the shipped copy
        run: |
          set -eux
          cd "$GITHUB_WORKSPACE"
          cp dist/coresight-etm4x.ko dist/coresight-etm4x-unstripped.ko
          llvm-objcopy --strip-debug dist/coresight-etm4x.ko
          ls -l dist/

      - name: Package KernelSU / Magisk module zip
        run: |
          set -eux
          cd "$GITHUB_WORKSPACE"
          cp dist/coresight-etm4x.ko ksu-module/coresight-etm4x.ko
          chmod +x ksu-module/post-fs-data.sh ksu-module/service.sh
          ( cd ksu-module && zip -r9 "$GITHUB_WORKSPACE/dist/ksu-coresight-etm4x.zip" . )
          unzip -l dist/ksu-coresight-etm4x.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coresight-etm4x
          path: |
            dist/coresight-etm4x.ko
            dist/coresight-etm4x-unstripped.ko
            dist/ksu-coresight-etm4x.zip
          if-no-files-found: error
          retention-days: 30
